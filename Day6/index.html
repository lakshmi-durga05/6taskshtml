
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration Form</title>
</head>

<body>

    <h2>Course Registration Form</h2>

    <form action="thankyou.html">

        <label>Personal Details</label>

        <br><br>

        <label for="fname">First Name:</label>
        <input type="text" id="fname" required pattern="[A-Za-z ]+">

        <br><br>

        <label for="surname">Surname:</label>
        <input type="text" id="surname" required pattern="[A-Za-z ]+">

        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" required pattern="[6-9][0-9]{9}" maxlength="10">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" required minlength="8"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}">

        <br><br>

        <label for="cpassword">Confirm Password:</label>
        <input type="password" id="cpassword" required>

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" required>

        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>

        <input type="radio" id="others" name="gender">
        <label for="others">Others</label>

        <br><br>

        <label>Select Country:</label>

        <select required>
            <option value="">--Select Country--</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Australia</option>
        </select>

        <br><br>

        <label for="picture">Upload Picture:</label>
        <input type="file" id="picture" accept="image/*" required>

        <br><br>

        <input type="reset" value="Reset">

        <br><br>

        <hr>

        <label>Course Details</label>

        <br><br>

        <label>Select Course:</label>

        <select required>
            <option value="">--Select Course--</option>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
            <option>React</option>
            <option>MERN Stack</option>
            <option>Java</option>
        </select>

        <br><br>

        <label>Delivery Mode:</label>

        <input type="radio" id="online" name="delivery" required>
        <label for="online">Online</label>

        <input type="radio" id="offline" name="delivery">
        <label for="offline">Offline</label>

        <br><br>

        <label for="comments">Comments:</label>

        <br>

        <textarea id="comments" rows="5" cols="40" required></textarea>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
